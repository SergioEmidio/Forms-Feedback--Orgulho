name: Manter backend acordado
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # também permite rodar manualmente, pelo botão "Run workflow" no GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a API pra não deixar ela (e o banco) dormirem
        run: curl -s -o /dev/null -w "Status: %{http_code}\n" https://feedback-orion-project.onrender.com/saude